[package]
name = "obsos-fossai"
description = "OBSOS на FossAi: окно стола FossAi и службы системы для obsos-core; servoprobe — Servo без окна (страница → снимок)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Собирается только под `<арх>-unknown-freeos` — сборщиком FossAi
# (ports/servo/builder/build-servoprobe.sh в репозитории FossAi, см. README).
# Программы: `browser` (в пакете FossAi — /opt/obsos/bin/obsos) и
# `servoprobe`.

[lib]
path = "src/lib.rs"

[[bin]]
name = "browser"
path = "src/bin/browser.rs"

[[bin]]
name = "servoprobe"
path = "src/bin/servoprobe.rs"

[dependencies]
obsos-core = { path = "../obsos-core" }
servo.workspace = true
euclid.workspace = true
ipc-channel.workspace = true
dpi.workspace = true
url.workspace = true
log.workspace = true
